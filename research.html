<style>
/* ===== ALOHA 单臂机器人 · 匀速推门露出小狗狗（仅限本页） ===== */
.rs-scene { margin: 8px 0 0; }
.rs-stage {
  position: relative;
  width: 320px;
  max-width: 100%;
  height: 240px;
  perspective: 720px;
}
/* ---- 门框与门洞 ---- */
.rs-frame {
  position: absolute;
  left: 30px; top: 26px;
  width: 130px; height: 186px;
  background: #efe6d2;
  border: 3px solid #d9c9a8;
  border-radius: 6px 6px 3px 3px;
}
.rs-doorway {
  position: absolute;
  left: 8px; top: 8px;
  width: 108px; height: 166px;
  background: #eef2ea;
  border-radius: 3px;
  overflow: hidden;
}
/* 房间地面线 */
.rs-doorway::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 20px;
  height: 1px;
  background: #d7e0d2;
}
/* ---- 小狗狗 ---- */
.rs-croc {
  position: absolute;
  left: 55%; bottom: 6px;
  transform: translateX(-50%);
  width: 96px; height: 84px;
}
.rs-croc .tail {
  transform-box: fill-box;
  transform-origin: 85% 60%;
  animation: rs-wag 1.6s ease-in-out infinite;
}
.rs-croc .eye-close {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  animation: rs-blink 4.2s ease-in-out infinite;
}
/* ---- 门（3D 旋转） ---- */
.rs-door {
  position: absolute;
  left: 8px; top: 8px;
  width: 108px; height: 166px;
  background: linear-gradient(90deg, #e3d4b0, #d3bf92 78%, #c8b183);
  border: 2px solid #b99f6e;
  border-left-width: 4px;
  border-radius: 3px 8px 8px 3px;
  transform-origin: left center;
  transform-style: preserve-3d;
  z-index: 3;
  animation: rs-door 7.2s linear infinite;
}
.rs-door::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(255,255,255,.18), rgba(0,0,0,.05) 55%, rgba(0,0,0,.12));
  border-radius: inherit;
}
.rs-handle {
  position: absolute;
  right: 9px; top: 50%;
  width: 9px; height: 9px;
  margin-top: -4.5px;
  background: #7d6643;
  border-radius: 50%;
  box-shadow: 0 1px 2px rgba(0,0,0,.35);
}
/* ---- ALOHA 机身框架 ---- */
.rs-arm { position: absolute; inset: 0; z-index: 5; }
.aloha-post {
  position: absolute;
  left: 232px; top: 70px;
  width: 16px; height: 120px;
  background: linear-gradient(90deg, #c7cfd4, #e6ebee 45%, #b9c3c9);
  border-radius: 2px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), 0 1px 3px rgba(0,0,0,.08);
  z-index: 2;
}
.aloha-post::after { /* 绿色线缆 */
  content: "";
  position: absolute;
  left: 13px; top: 6px; bottom: 6px;
  width: 2px;
  background: #4a9d72;
  border-radius: 1px;
}
.aloha-bar {
  position: absolute;
  left: 222px; top: 62px;
  width: 36px; height: 9px;
  background: linear-gradient(180deg, #8d99a1, #6f7b83);
  border-radius: 2px;
  z-index: 3;
}
.aloha-base {
  position: absolute;
  left: 216px; top: 196px;
  width: 48px; height: 14px;
  background: linear-gradient(180deg, #d7dde1, #aeb9c0);
  border-radius: 3px 3px 7px 7px;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
  z-index: 2;
}
/* ---- ALOHA 单臂（建模细节：肩座 / 上臂线缆 / 肘关节 / 前臂线缆 / 腕爪座 / 两指夹爪） ---- */
.al-arm { position: absolute; top: 0; left: 0; width: 320px; height: 240px; z-index: 5; }
.aloha-shoulder { /* 肩座：固定于立柱，承载机械臂 */
  position: absolute;
  left: 221px; top: 106px;
  width: 22px; height: 28px;
  background: linear-gradient(180deg, #5c6871, #39434b);
  border-radius: 4px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 2px 3px rgba(0,0,0,.25);
  z-index: 4;
}
.aloha-shoulder::after { /* 侧装螺栓 */
  content: "";
  position: absolute;
  left: 3px; top: 9px;
  width: 16px; height: 3px;
  background: #232a30;
  border-radius: 1px;
  box-shadow: 0 6px 0 #232a30;
}
.al-arm .al-upper { /* 上臂连杆 */
  position: absolute;
  width: 70px; height: 12px;
  background: linear-gradient(180deg, #4d575f, #2d353b);
  border: 1px solid #1e2429;
  border-radius: 4px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
  transform-origin: right center;
}
.al-arm .al-upper::before { /* 上臂内部线缆 */
  content: "";
  position: absolute;
  left: 5px; right: 18px; top: 2px;
  height: 2px;
  background: linear-gradient(90deg, #4a9d72, #357a57);
  border-radius: 1px;
  box-shadow: 0 5px 0 rgba(74,157,114,.55);
}
.al-arm .al-upper::after { /* 肩关节（轴心法兰） */
  content: "";
  position: absolute;
  left: 60px; top: -4px;
  width: 18px; height: 18px;
  background: radial-gradient(circle at 35% 35%, #8a979f, #454f57 70%);
  border-radius: 50%;
  box-shadow: 0 0 0 2px #232a30, inset 0 -1px 1px rgba(0,0,0,.4);
}
.al-arm .al-fore { /* 前臂连杆 */
  position: absolute;
  width: 60px; height: 10px;
  background: linear-gradient(180deg, #3f4950, #242b31);
  border: 1px solid #1a2025;
  border-radius: 4px;
  transform-origin: right center;
}
.al-arm .al-fore::before { /* 前臂内部线缆 */
  content: "";
  position: absolute;
  left: 5px; right: 15px; top: 2px;
  height: 2px;
  background: linear-gradient(90deg, #4a9d72, #357a57);
  border-radius: 1px;
}
.al-arm .al-fore::after { /* 肘关节（轴心法兰） */
  content: "";
  position: absolute;
  left: 51px; top: -4px;
  width: 16px; height: 16px;
  background: radial-gradient(circle at 35% 35%, #7a8790, #3f4951 70%);
  border-radius: 50%;
  box-shadow: 0 0 0 2px #232a30, inset 0 -1px 1px rgba(0,0,0,.4);
}
.al-arm .al-grip { /* 腕爪组件，右端=腕点 */
  position: absolute;
  width: 24px; height: 20px;
  transform-origin: right center;
}
.al-arm .al-grip::before { /* 腕部连接座 */
  content: "";
  position: absolute;
  left: 0; top: -1px;
  width: 9px; height: 22px;
  background: linear-gradient(180deg, #55606a, #333c43);
  border-radius: 3px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
}
.al-arm .al-grip i {
  position: absolute;
  top: 4px;
  width: 20px; height: 8px;
  background: linear-gradient(180deg, #2b3238, #171c20);
  border-radius: 3px 2px 2px 5px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  transform-origin: right center;
}
.al-arm .al-grip i::after { /* 指尖 */
  content: "";
  position: absolute;
  left: 0; top: 2px;
  width: 5px; height: 4px;
  background: #4a545b;
  border-radius: 2px 0 0 2px;
}
.al-arm .al-grip .g1 { left: 0; }
.al-arm .al-grip .g2 { left: 4px; }
/* 单臂（拉门）：肩关节在 (232,120)，挂载于立柱左侧 */
.al-arm .al-upper { left: 162px; top: 114px; animation: al-upper 7.2s linear infinite; }
.al-arm .al-fore  { left: -60px; top: 1px;   animation: al-fore 7.2s linear infinite; }
.al-arm .al-grip  { left: -24px; top: -4px;  animation: al-claw 7.2s linear infinite; }
.al-arm .al-grip .g1 { animation: al-grip1 7.2s linear infinite; }
.al-arm .al-grip .g2 { animation: al-grip2 7.2s linear infinite; }
/* ---- 关键帧（开门/关门匀速 linear） ---- */
@keyframes rs-door {
  0%, 20%  { transform: rotateY(0deg); }
  42%, 78% { transform: rotateY(-93deg); }
  92%, 100%{ transform: rotateY(0deg); }
}
/* 单臂：垂下 -> 抓把手 -> 匀速拉门 -> 松手缩回 -> 垂下 */
@keyframes al-upper {
  0%, 10%  { transform: rotate(-62deg); }
  14%, 20% { transform: rotate(-38.2deg); }
  36%, 42% { transform: rotate(-30.1deg); }
  46%, 100%{ transform: rotate(-62deg); }
}
@keyframes al-fore {
  0%, 10%  { transform: rotate(0deg); }
  14%, 20% { transform: rotate(84.4deg); }
  36%, 42% { transform: rotate(65.9deg); }
  46%, 100%{ transform: rotate(0deg); }
}
@keyframes al-claw {
  0%, 10%  { transform: rotate(0deg) translateX(6px); }
  14%, 20% { transform: rotate(0deg) translateX(0px); }
  36%, 42% { transform: rotate(3deg) translateX(0px); }
  46%, 100%{ transform: rotate(0deg) translateX(3px); }
}
@keyframes al-grip1 {
  0%, 14%  { transform: rotate(18deg); }
  20%, 42% { transform: rotate(4deg); }
  46%, 100%{ transform: rotate(18deg); }
}
@keyframes al-grip2 {
  0%, 14%  { transform: rotate(-18deg); }
  20%, 42% { transform: rotate(-4deg); }
  46%, 100%{ transform: rotate(-18deg); }
}
@keyframes rs-wag {
  0%, 100% { transform: rotate(-6deg); }
  50%      { transform: rotate(8deg); }
}
@keyframes rs-blink {
  0%, 92%, 100% { transform: scaleY(1); }
  95%           { transform: scaleY(.12); }
}
@media (prefers-reduced-motion: reduce) {
  .rs-stage, .rs-door, .al-arm, .al-arm * , .rs-croc .tail, .rs-croc .eye-close { animation: none; }
  .rs-door { transform: rotateY(-93deg); }
  .al-arm .al-upper { transform: rotate(-62deg); }
  .al-arm .al-fore { transform: rotate(0deg); }
  .al-arm .al-grip { transform: rotate(0deg) translateX(3px); }
}
</style>
